<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta -->
    <meta name="theme-color" content="#dc2626" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zamzam Foods" />

    <!-- SEO -->
    <meta name="description" content="Zamzam Foods Business Management System — Kubbus & Romali wholesale distribution, driver dispatch, delivery routes, and credit ledger." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Aggressive Cache Busting Meta -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>Zamzam Foods — Distribution Management</title>
    
    <script>
      // Automatic Cache Invalidation Engine (v3.2.1)
      (function() {
        var APP_BUILD_ID = '20261001-v3.2.1';
        var lastBuild = localStorage.getItem('zamzam_app_build');
        if (lastBuild !== APP_BUILD_ID) {
          localStorage.setItem('zamzam_app_build', APP_BUILD_ID);
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
