<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="40%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="darkRedShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#450a0a" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Background with dark red border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#7f1d1d" stroke-width="12"/>
  
  <!-- Subtle inner glow -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#ef4444" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Yellow Lettering with Dark Red Shadow -->
  <text x="50%" y="54%" font-family="system-ui, -apple-system, sans-serif" font-size="290" font-weight="900" fill="#fbbf24" filter="url(#darkRedShadow)" dominant-baseline="middle" text-anchor="middle">Z</text>
  
  <!-- Golden Dot Accent -->
  <circle cx="395" cy="115" r="32" fill="#f59e0b" stroke="#7f1d1d" stroke-width="4" filter="url(#darkRedShadow)" />
</svg>
