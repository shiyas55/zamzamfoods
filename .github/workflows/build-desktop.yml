name: Build Desktop App (Windows .EXE & macOS .DMG)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            name: 'windows-exe'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            name: 'macos-dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: npm ci

      - name: Build Desktop Application (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './frontend'
          tagName: v1.0.0
          releaseName: 'Zamzam Foods v1.0.0'
          releaseBody: 'Automated desktop build for Windows (.exe) and macOS (.dmg)'
          releaseDraft: false
          prerelease: false

      - name: Upload Windows .EXE artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Zamzam-Foods-Windows-Installer
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS .DMG artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Zamzam-Foods-macOS-Installer
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
