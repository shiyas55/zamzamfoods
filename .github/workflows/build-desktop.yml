name: Build Desktop App (Windows .EXE & macOS .DMG)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            name: 'windows-exe'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            name: 'macos-dmg'

    runs-on: ${{ matrix.platform }}
    env:
      VITE_API_URL: https://zamzamfood.up.railway.app/api/v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (frontend)
        working-directory: frontend
        run: npm ci

      - name: Build Desktop Application (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: https://zamzamfood.up.railway.app/api/v1
        with:
          projectPath: './frontend'
          tagName: v__VERSION__
          releaseName: 'Zamzam Foods v__VERSION__'
          releaseBody: |
            Zamzam Foods v__VERSION__ Desktop Release (Windows & macOS)

            ### Key Enhancements & Optimizations:
            - **Performance & Code Splitting**: 95% reduction in initial entry JavaScript bundle (from 1.25 MB down to 62 kB) with dynamic route and heavy component lazy-loading.
            - **Automated Disaster Recovery**: Scheduled 23:59 local SQLite snapshot engine, multi-format backup CLI (`backup_database`), and automated DB restore verification.
            - **Security Hardening**: Brute-force rate limiting on Settings PIN verification and IP-based rate limiting on public customer order submission.
            - **Mobile Upload Efficiency**: Client-side canvas image downscaling to prevent network saturation and optimize Cloudinary bandwidth.
            - **Quality Assurance**: Complete 135-test automated test suite passing across all RBAC, ledger, wholesale pricing, and route delivery flows.
          releaseDraft: false
          prerelease: false

      - name: Upload Windows .EXE artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Zamzam-Foods-Windows-Installer
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS .DMG artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Zamzam-Foods-macOS-Installer
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
